name: Force Seed DB

on:
  push:
    branches: [dev]
    paths:
      - 'force-seed.txt'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::648592435113:role/ZLT_SOS_Git_Admin
          aws-region: ap-south-1

      - name: Get secrets and Seed
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id zltsos/dev --query SecretString --output text)
          BACKEND_URL=$(echo $SECRET | jq -r '.BACKEND_URL')
          echo "Hitting $BACKEND_URL/api/force-seed"
          curl -v "$BACKEND_URL/api/force-seed"
          curl -v "$BACKEND_URL/api/debug-users"
